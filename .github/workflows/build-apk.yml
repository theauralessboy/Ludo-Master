
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova and Build APK
        run: |
          npm install -g cordova
          cordova create myApp com.ludo.master "Ludo Master"
          cd myApp
          rsync -av --exclude='myApp' --exclude='.git' --exclude='.github' ../ .
          cordova platform add android
          cordova build android --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Master-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk